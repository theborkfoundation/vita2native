<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vita2native</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vercel: {
              bg: '#000000',
              surface: '#0A0A0A',
              elevated: '#111111',
              border: '#1F1F1F',
              'border-hover': '#333333',
              text: '#EDEDED',
              muted: '#888888'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['"Geist Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-black text-[#EDEDED] antialiased selection:bg-white selection:text-black">
  <div id="app"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
