[Service]
# The kiosk never relaunches itself: a title that exits or crashes leaves the
# session stopped, so the game's exit status stays meaningful and a crash loop
# cannot hammer the board. Rerun with `systemctl restart` (or `tools/v2n`).
#
# Install with:
#   sudo mkdir -p /etc/systemd/system/tigervncserver@.service.d
#   sudo cp tools/opiz3-vnc/tigervncserver-override.conf \
#       /etc/systemd/system/tigervncserver@.service.d/override.conf
#   sudo systemctl daemon-reload
Restart=no
