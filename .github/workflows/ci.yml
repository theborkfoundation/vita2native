name: CI

# The deployable artifact is 32-bit ARM, which no hosted runner can execute.
# CI therefore does two things it can do: cross-build the artifact so the ARM
# code path cannot rot, and build + run the smoke suite as x86-64 Linux code
# (the x64-syntax preset), which covers the portable modules.
#
# Device-only coverage (GPU bring-up, input, audio, real titles) stays manual:
# see tools/v2n and the skills under .agents/skills.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/build/.zig-cache
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/build/.zig-cache

jobs:
  build:
    name: build (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: arm-rel
            arch: arm
          - preset: x64-syntax
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # The toolchain files point at wrappers generated into build/.
      - name: Generate the zig wrappers
        run: tools/zig-toolchain.sh ${{ matrix.arch }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j"$(nproc)"

  test:
    name: smoke tests (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # SDL is dlopen'd by the audio and video hosts, so the tests tolerate its
      # absence, but installing it keeps the run close to the device.
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0

      - name: Generate the zig wrappers
        run: tools/zig-toolchain.sh x64

      - name: Configure and build
        run: |
          cmake --preset x64-syntax
          cmake --build --preset x64-syntax -j"$(nproc)"

      # The same set the device runs (`tools/v2n test`), minus two groups that
      # cannot work on a hosted runner: needs-gl tests have no GPU/EGL, and
      # not-64bit tests encode 32-bit guest pointers in 32-bit struct fields.
      - name: Run the smoke suite
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ctest --test-dir build/cmake-x64 --output-on-failure \
                -LE '(needs-gl|not-64bit)'
